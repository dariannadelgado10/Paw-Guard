<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Datos de Salud</title>
<style>
body {
background-color: #FFF9C4; /* fondo amarillo suave */
font-family: Arial, sans-serif;
display: flex;
flex-direction: column;
align-items: center;
padding: 50px 20px;
min-height: 100vh;
text-align: center;
	}
	
	h1 {
color: #FF7043;
margin-bottom: 30px;
	}
	
	.cuadro-texto {
background-color: rgba(255, 255, 153, 0.9);
padding: 25px 40px;
border-radius: 15px;
font-size: 20px;
color: #4E342E;
line-height: 1.6;
margin-top: 25px;
max-width: 700px;
text-align: justify;
box-shadow: 0 2px 6px rgba(0,0,0,0.2);
	}
	
	img {
width: 400px;
height: auto;
border: 5px solid #FF7043;
border-radius: 15px;
margin-bottom: 30px;
	}
	
	.boton-volver {
margin-top: 30px;
padding: 15px 30px;
font-size: 18px;
background-color: #29B6F6;
color: white;
border: none;
border-radius: 10px;
cursor: pointer;
transition: 0.3s;
	}
	
.boton-volver:hover {
background-color: #0288D1;
	}
	</style>
	</head>
	<body>
	<h1>Datos de Salud</h1>
	
	<!-- Foto de Hassam -->
	<img src="imagenes/perrito5.jpg" alt="Hassam">
	
	<!-- Texto dentro de cuadro -->
	<div class="cuadro-texto">
	Hassam no padece de ninguna enfermedad grave, pero es sensible a ciertos tipos de alimentos para perro y puede enfermarse facilmente si no se le da comida adecuada. Es importante cuidar su alimentacion y mantenerlo saludable mediante revisiones y atencion constante.
			</div>
			
			<!-- Botón volver al menú -->
			<button class="boton-volver" onclick="window.location.href='index.html'">Volver</button>
			</body>
			</html>
